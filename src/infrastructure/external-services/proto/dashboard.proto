syntax = "proto3";

package medical.dashboard;

service DashboardService {
  rpc GetRoles (Empty) returns (RolesResponse);
  rpc GetPermissions (Empty) returns (PermissionsResponse);
  rpc GetSpecialties (GetSpecialtiesRequest) returns (SpecialtiesResponse);
  rpc GetSystemStatuses (Empty) returns (SystemStatusesResponse);
}

message Empty {}

message TranslatedValue {
  string lang = 1;
  string value = 2;
}

message Specialty {
  string _id = 1;
  repeated TranslatedValue name = 2;
  string slug = 3;
  repeated TranslatedValue description = 4;
  bool isActive = 5;
}

message GetSpecialtiesRequest {
  bool onlyActive = 1;
  string lang = 2;
}

message SpecialtiesResponse {
  repeated Specialty data = 1;
}

message Role {
  string _id = 1;
  repeated TranslatedValue name = 2;
  repeated TranslatedValue description = 3;
  repeated string permissionsId = 4;
  bool isActive = 5;
}

message RolesResponse {
  repeated Role data = 1;
}

message Permission {
  string _id = 1;
  string entityName = 2;
  string actionId = 3;
  repeated TranslatedValue name = 4;
  repeated TranslatedValue description = 5;
  bool isActive = 6;
}

message PermissionsResponse {
  repeated Permission data = 1;
}

message SystemStatus {
  string _id = 1;
  string category = 2;
  string statusCode = 3;
  repeated TranslatedValue label = 4;
  string color = 5;
  bool isActive = 6;
}

message SystemStatusesResponse {
  repeated SystemStatus data = 1;
}
